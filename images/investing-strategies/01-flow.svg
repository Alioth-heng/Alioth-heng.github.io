<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="价值思路怎样成为完整策略"><title>价值思路怎样成为完整策略</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">价值思路怎样成为完整策略</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">买什么、何时买、买多少、何时卖，要说清楚</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">① 选范围</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">候选企业</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">行业、规模、上市状</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">态，决定在哪个货架</text><text x="80.0" y="478" font-size="20" fill="#607369" font-weight="400">挑货。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">② 看账本</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">筛选与排序</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">估值、债务、增长和</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">现金流如何组合？</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">③ 分预算</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">目标仓位</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">持有几只？每只占多</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">少？现金留多少？</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">④ 再复查</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">调仓与退出</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">多久复查？不符合条</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">件后怎样退出？</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">研究企业价值，不等于示例代码一定采用多年持有。</text></g></svg>