<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="总价更低，不一定更便宜"><title>总价更低，不一定更便宜</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">总价更低，不一定更便宜</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">用两家虚构店铺，理解价格与年度盈利的关系</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58" y="220" width="230" height="65" rx="0" fill="#176b53"/><text x="74" y="262" font-size="22" fill="white" font-weight="700">店铺</text><rect x="288" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="304" y="262" font-size="22" fill="white" font-weight="700">售价</text><rect x="572.6666666666667" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="588.6666666666667" y="262" font-size="22" fill="white" font-weight="700">年净利润</text><rect x="857.3333333333335" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="873.3333333333335" y="262" font-size="22" fill="white" font-weight="700">PE倍数</text><rect x="58" y="285" width="230" height="65" rx="0" fill="#edf3eb"/><text x="74" y="326.5" font-size="23" fill="#243831" font-weight="400">甲</text><rect x="288" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="304" y="326.5" font-size="23" fill="#243831" font-weight="400">100万元</text><rect x="572.6666666666667" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="588.6666666666667" y="326.5" font-size="23" fill="#243831" font-weight="400">10万元</text><rect x="857.3333333333335" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="873.3333333333335" y="326.5" font-size="23" fill="#243831" font-weight="400">10倍</text><rect x="58" y="350" width="230" height="65" rx="0" fill="#f7f9f2"/><text x="74" y="391.5" font-size="23" fill="#243831" font-weight="400">乙</text><rect x="288" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="304" y="391.5" font-size="23" fill="#243831" font-weight="400">80万元</text><rect x="572.6666666666667" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="588.6666666666667" y="391.5" font-size="23" fill="#243831" font-weight="400">4万元</text><rect x="857.3333333333335" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="873.3333333333335" y="391.5" font-size="23" fill="#243831" font-weight="400">20倍</text><text x="62" y="598" font-size="20" fill="#176b53" font-weight="400">乙总价低，但每买1元年度盈利，需要付出更高的价格。</text></g></svg>