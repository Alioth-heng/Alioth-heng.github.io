<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="PEG：让价格与增长一起比较"><title>PEG：让价格与增长一起比较</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">PEG：让价格与增长一起比较</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">此处增长率按百分数数值计算；实际字段单位必须核对</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58" y="220" width="230" height="65" rx="0" fill="#176b53"/><text x="74" y="262" font-size="22" fill="white" font-weight="700">企业</text><rect x="288" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="304" y="262" font-size="22" fill="white" font-weight="700">PE</text><rect x="572.6666666666667" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="588.6666666666667" y="262" font-size="22" fill="white" font-weight="700">增长率数值</text><rect x="857.3333333333335" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="873.3333333333335" y="262" font-size="22" fill="white" font-weight="700">PEG</text><rect x="58" y="285" width="230" height="65" rx="0" fill="#edf3eb"/><text x="74" y="326.5" font-size="23" fill="#243831" font-weight="400">甲</text><rect x="288" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="304" y="326.5" font-size="23" fill="#243831" font-weight="400">20</text><rect x="572.6666666666667" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="588.6666666666667" y="326.5" font-size="23" fill="#243831" font-weight="400">40% → 40</text><rect x="857.3333333333335" y="285" width="284.6666666666667" height="65" rx="0" fill="#edf3eb"/><text x="873.3333333333335" y="326.5" font-size="23" fill="#243831" font-weight="400">0.5</text><rect x="58" y="350" width="230" height="65" rx="0" fill="#f7f9f2"/><text x="74" y="391.5" font-size="23" fill="#243831" font-weight="400">乙</text><rect x="288" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="304" y="391.5" font-size="23" fill="#243831" font-weight="400">20</text><rect x="572.6666666666667" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="588.6666666666667" y="391.5" font-size="23" fill="#243831" font-weight="400">10% → 10</text><rect x="857.3333333333335" y="350" width="284.6666666666667" height="65" rx="0" fill="#f7f9f2"/><text x="873.3333333333335" y="391.5" font-size="23" fill="#243831" font-weight="400">2.0</text><text x="62" y="598" font-size="20" fill="#176b53" font-weight="400">不能把40与0.40混用；还要判断增长是否真实、是否可持续。</text></g></svg>