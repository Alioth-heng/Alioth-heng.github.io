<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="给一家店贴四张估值标签"><title>给一家店贴四张估值标签</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">给一家店贴四张估值标签</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">价格不是唯一线索：还要看盈利、家底、收入和分红</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">PE 市盈率</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">价格 / 盈利</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">比较每1元年度盈利，</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">对应多高的购买价格</text><text x="80.0" y="478" font-size="20" fill="#607369" font-weight="400">。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">PB 市净率</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">价格 / 净资产</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">账面家当减去负债，</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">不等于实际变现价值</text><text x="356.0" y="478" font-size="20" fill="#607369" font-weight="400">。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">PS 市销率</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">价格 / 营收</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">营业收入很高，也可</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">能赚不到利润。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">股息率</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">现金分红 / 股</text><text x="908.0" y="369" font-size="28" fill="#243831" font-weight="400">价</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">过去分得多，不保证</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">未来分得多。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">比较工具不是未来承诺：盈利、资产价值和分红都会变化。</text></g></svg>