<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="MACD柱值：穿零与持续为正不同"><title>MACD柱值：穿零与持续为正不同</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">MACD柱值：穿零与持续为正不同</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">只演示条件判断；不是价格曲线或历史交易结果</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><line x1="100" y1="400" x2="1100" y2="400" stroke="#243831" stroke-width="2"/><text x="1065" y="389" font-size="19" fill="#607369" font-weight="400">零轴</text><rect x="120" y="400" width="58" height="132" rx="4" fill="#28618a"/><text x="140" y="560" font-size="18" fill="#607369" font-weight="400">1</text><rect x="225" y="400" width="58" height="88" rx="4" fill="#28618a"/><text x="245" y="560" font-size="18" fill="#607369" font-weight="400">2</text><rect x="330" y="400" width="58" height="44" rx="4" fill="#28618a"/><text x="350" y="560" font-size="18" fill="#607369" font-weight="400">3</text><rect x="435" y="356" width="58" height="44" rx="4" fill="#176b53"/><text x="455" y="560" font-size="18" fill="#607369" font-weight="400">4</text><rect x="540" y="290.0" width="58" height="110.0" rx="4" fill="#176b53"/><text x="560" y="560" font-size="18" fill="#607369" font-weight="400">5</text><rect x="645" y="312" width="58" height="88" rx="4" fill="#176b53"/><text x="665" y="560" font-size="18" fill="#607369" font-weight="400">6</text><rect x="750" y="356" width="58" height="44" rx="4" fill="#176b53"/><text x="770" y="560" font-size="18" fill="#607369" font-weight="400">7</text><rect x="855" y="400" width="58" height="44" rx="4" fill="#28618a"/><text x="875" y="560" font-size="18" fill="#607369" font-weight="400">8</text><rect x="960" y="400" width="58" height="88" rx="4" fill="#28618a"/><text x="980" y="560" font-size="18" fill="#607369" font-weight="400">9</text><text x="400" y="245" font-size="29" fill="#176b53" font-weight="700">负 → 正</text><text x="400" y="285" font-size="22" fill="#243831" font-weight="400">空仓时形成买入条件</text><text x="785" y="245" font-size="29" fill="#28618a" font-weight="700">正 → 负</text><text x="785" y="285" font-size="22" fill="#243831" font-weight="400">有仓时形成退出条件</text><text x="100" y="612" font-size="23" fill="#176b53" font-weight="700">第4至第7段持续为正，不等于每段都新发生一次穿零。</text></g></svg>