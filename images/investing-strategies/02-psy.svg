<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="PSY：最近有几天上涨？"><title>PSY：最近有几天上涨？</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">PSY：最近有几天上涨？</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">12个相邻日涨跌判断中，9个上涨 → 9÷12×100%=75%</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="92" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="122" y="281" font-size="21" fill="#243831" font-weight="400">第1天</text><text x="116" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="266" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="296" y="281" font-size="21" fill="#243831" font-weight="400">第2天</text><text x="290" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="440" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="470" y="281" font-size="21" fill="#243831" font-weight="400">第3天</text><text x="464" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="614" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="644" y="281" font-size="21" fill="#243831" font-weight="400">第4天</text><text x="638" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="788" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="818" y="281" font-size="21" fill="#243831" font-weight="400">第5天</text><text x="812" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="962" y="238" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="992" y="281" font-size="21" fill="#243831" font-weight="400">第6天</text><text x="986" y="320" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="92" y="373" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="122" y="416" font-size="21" fill="#243831" font-weight="400">第7天</text><text x="116" y="455" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="266" y="373" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="296" y="416" font-size="21" fill="#243831" font-weight="400">第8天</text><text x="290" y="455" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="440" y="373" width="144" height="102" rx="14" fill="#e7f1e9"/><text x="470" y="416" font-size="21" fill="#243831" font-weight="400">第9天</text><text x="464" y="455" font-size="23" fill="#176b53" font-weight="700">上涨 ↑</text><rect x="614" y="373" width="144" height="102" rx="14" fill="#e7eff6"/><text x="644" y="416" font-size="21" fill="#243831" font-weight="400">第10天</text><text x="638" y="455" font-size="23" fill="#28618a" font-weight="700">未上涨</text><rect x="788" y="373" width="144" height="102" rx="14" fill="#e7eff6"/><text x="818" y="416" font-size="21" fill="#243831" font-weight="400">第11天</text><text x="812" y="455" font-size="23" fill="#28618a" font-weight="700">未上涨</text><rect x="962" y="373" width="144" height="102" rx="14" fill="#e7eff6"/><text x="992" y="416" font-size="21" fill="#243831" font-weight="400">第12天</text><text x="986" y="455" font-size="23" fill="#28618a" font-weight="700">未上涨</text><text x="90" y="568" font-size="38" fill="#176b53" font-weight="700">PSY=75%</text><text x="400" y="568" font-size="25" fill="#243831" font-weight="400">数天数，不是计算涨幅大小。</text><text x="90" y="615" font-size="21" fill="#607369" font-weight="400">SAR像移动警戒线：满足退出条件，也不保证按预想价格成交。</text></g></svg>