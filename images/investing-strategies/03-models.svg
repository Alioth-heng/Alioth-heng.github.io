<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="三种多因子组合方式"><title>三种多因子组合方式</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">三种多因子组合方式</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">名称相似，也可能使用不同特征和相反排序方向</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">三因子模型</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">统一尺度</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">先标准化，再对质量项加分、</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">估值项减分。</text><line x1="408.0" y1="378" x2="424.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M414.0,371 L424.0,378 L414.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="426.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="448.0" y="269" font-size="20" fill="#28618a" font-weight="700">固定打分</text><text x="448.0" y="329" font-size="28" fill="#243831" font-weight="400">按阈值分档</text><text x="448.0" y="414" font-size="20" fill="#607369" font-weight="400">给0、5或10分；等于边界时要</text><text x="448.0" y="446" font-size="20" fill="#607369" font-weight="400">核对不等式。</text><line x1="776.0" y1="378" x2="792.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M782.0,371 L792.0,378 L782.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="794.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="816.0" y="269" font-size="20" fill="#b77428" font-weight="700">多因子alpha</text><text x="816.0" y="329" font-size="28" fill="#243831" font-weight="400">相对排名分档</text><text x="816.0" y="414" font-size="20" fill="#607369" font-weight="400">分20档累计；原代码综合分越</text><text x="816.0" y="446" font-size="20" fill="#607369" font-weight="400">小越优先。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">同样叫多因子，评分公式与特征方向仍要逐项核对。</text></g></svg>