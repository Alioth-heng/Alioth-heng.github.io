<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="三顶帽子，不等于三位面试官"><title>三顶帽子，不等于三位面试官</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">三顶帽子，不等于三位面试官</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">PE、PB、PS都含价格或市值信息，可能重复表达相同因素</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">盈利估值</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">PE低</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">可能价格低，也可能盈利暂时</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">处于高点。</text><line x1="408.0" y1="378" x2="424.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M414.0,371 L424.0,378 L414.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="426.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="448.0" y="269" font-size="20" fill="#28618a" font-weight="700">账面估值</text><text x="448.0" y="329" font-size="28" fill="#243831" font-weight="400">PB低</text><text x="448.0" y="414" font-size="20" fill="#607369" font-weight="400">可能与相同一批经营承压的企</text><text x="448.0" y="446" font-size="20" fill="#607369" font-weight="400">业重合。</text><line x1="776.0" y1="378" x2="792.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M782.0,371 L792.0,378 L782.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="794.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="816.0" y="269" font-size="20" fill="#b77428" font-weight="700">收入估值</text><text x="816.0" y="329" font-size="28" fill="#243831" font-weight="400">PS低</text><text x="816.0" y="414" font-size="20" fill="#607369" font-weight="400">收入很多，仍可能利润率很低</text><text x="816.0" y="446" font-size="20" fill="#607369" font-weight="400">。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">标签越多，不代表相互独立的证据就同样多。</text></g></svg>