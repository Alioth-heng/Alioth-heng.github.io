<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="不同满分的考试，先换成可比尺度"><title>不同满分的考试，先换成可比尺度</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">不同满分的考试，先换成可比尺度</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">虚构标准分：综合分=ROIC分−PB分−PS分</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58" y="220" width="230" height="65" rx="0" fill="#176b53"/><text x="74" y="262" font-size="22" fill="white" font-weight="700">企业</text><rect x="288" y="220" width="213.5" height="65" rx="0" fill="#176b53"/><text x="304" y="262" font-size="22" fill="white" font-weight="700">ROIC分</text><rect x="501.5" y="220" width="213.5" height="65" rx="0" fill="#176b53"/><text x="517.5" y="262" font-size="22" fill="white" font-weight="700">PB分</text><rect x="715.0" y="220" width="213.5" height="65" rx="0" fill="#176b53"/><text x="731.0" y="262" font-size="22" fill="white" font-weight="700">PS分</text><rect x="928.5" y="220" width="213.5" height="65" rx="0" fill="#176b53"/><text x="944.5" y="262" font-size="22" fill="white" font-weight="700">综合分</text><rect x="58" y="285" width="230" height="65" rx="0" fill="#edf3eb"/><text x="74" y="326.5" font-size="23" fill="#243831" font-weight="400">甲</text><rect x="288" y="285" width="213.5" height="65" rx="0" fill="#edf3eb"/><text x="304" y="326.5" font-size="23" fill="#243831" font-weight="400">1.2</text><rect x="501.5" y="285" width="213.5" height="65" rx="0" fill="#edf3eb"/><text x="517.5" y="326.5" font-size="23" fill="#243831" font-weight="400">0.4</text><rect x="715.0" y="285" width="213.5" height="65" rx="0" fill="#edf3eb"/><text x="731.0" y="326.5" font-size="23" fill="#243831" font-weight="400">−0.2</text><rect x="928.5" y="285" width="213.5" height="65" rx="0" fill="#edf3eb"/><text x="944.5" y="326.5" font-size="23" fill="#243831" font-weight="400">1.0</text><rect x="58" y="350" width="230" height="65" rx="0" fill="#f7f9f2"/><text x="74" y="391.5" font-size="23" fill="#243831" font-weight="400">乙</text><rect x="288" y="350" width="213.5" height="65" rx="0" fill="#f7f9f2"/><text x="304" y="391.5" font-size="23" fill="#243831" font-weight="400">0.7</text><rect x="501.5" y="350" width="213.5" height="65" rx="0" fill="#f7f9f2"/><text x="517.5" y="391.5" font-size="23" fill="#243831" font-weight="400">−0.5</text><rect x="715.0" y="350" width="213.5" height="65" rx="0" fill="#f7f9f2"/><text x="731.0" y="391.5" font-size="23" fill="#243831" font-weight="400">−0.4</text><rect x="928.5" y="350" width="213.5" height="65" rx="0" fill="#f7f9f2"/><text x="944.5" y="391.5" font-size="23" fill="#243831" font-weight="400">1.6</text><text x="62" y="598" font-size="20" fill="#176b53" font-weight="400">减去负数会增加得分；高分不是未来盈利的保证。</text></g></svg>