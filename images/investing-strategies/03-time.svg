<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="历史决策只能用当时知道的信息"><title>历史决策只能用当时知道的信息</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">历史决策只能用当时知道的信息</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">像模拟去年考试：不能偷看今年才公布的答案</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">① 经营发生</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">报告期结束</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">报告期结束，不等于</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">财报已经公开。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">② 信息披露</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">投资者可获得</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">核对发布日期、数据</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">口径和修订版本。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">③ 决策形成</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">只看已知数据</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">不能用未来才知道的</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">条件挑历史股票。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">④ 观察未来</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">评价结果</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">未来收益只用于检验</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">，不能提前进入规则</text><text x="908.0" y="478" font-size="20" fill="#607369" font-weight="400">。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">每份财务数据，都应回答：那一天真的已经知道了吗？</text></g></svg>