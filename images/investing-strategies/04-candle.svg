<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="一根K线：一天价格的四个位置"><title>一根K线：一天价格的四个位置</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">一根K线：一天价格的四个位置</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">把交易日想成爬山：出发、山顶、谷底和最后停下的位置</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><line x1="460" y1="235" x2="460" y2="560" stroke="#243831" stroke-width="4"/><rect x="385" y="325" width="150" height="150" rx="0" fill="#dcefe5"/><line x1="550" y1="235" x2="650" y2="235" stroke="#dbe4dc" stroke-width="2"/><text x="680" y="243" font-size="25" fill="#243831" font-weight="400">最高价：到过的山顶</text><line x1="550" y1="325" x2="650" y2="325" stroke="#dbe4dc" stroke-width="2"/><text x="680" y="333" font-size="25" fill="#243831" font-weight="400">收盘价：最后停下的位置</text><line x1="550" y1="475" x2="650" y2="475" stroke="#dbe4dc" stroke-width="2"/><text x="680" y="483" font-size="25" fill="#243831" font-weight="400">开盘价：出发的位置</text><line x1="550" y1="560" x2="650" y2="560" stroke="#dbe4dc" stroke-width="2"/><text x="680" y="568" font-size="25" fill="#243831" font-weight="400">最低价：到过的谷底</text><text x="80" y="610" font-size="23" fill="#176b53" font-weight="700">示意为收盘高于开盘；单根形状不是完整的买卖理由。</text></g></svg>