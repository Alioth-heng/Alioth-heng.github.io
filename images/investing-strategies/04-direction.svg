<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="形态输出非零，不自动等于看涨"><title>形态输出非零，不自动等于看涨</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">形态输出非零，不自动等于看涨</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">这份Breakaway源码使用“输出不等于0”作为入选条件</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">① 输入</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">开 / 高 / 低 /</text><text x="80.0" y="369" font-size="28" fill="#243831" font-weight="400"> 收</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">取完整、时间对齐的</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">历史价格序列。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">② 识别</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">形态函数</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">CDLBREAKAWAY的返回</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">值有其方向含义。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">③ 条件</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">输出 ≠ 0</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">原代码在这里没有进</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">一步区分正负方向。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">④ 核对</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">为什么买？</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">不能把全部非零输出</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">都讲成上涨信号。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">图案故事、公式输出与真正买单逻辑，需要逐层对照。</text></g></svg>