<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="计划持有几天，和何时成交是两回事"><title>计划持有几天，和何时成交是两回事</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">计划持有几天，和何时成交是两回事</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">原示例periods=5，退出判断却写持有计数大于5</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">① 参数</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">计划约束</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">写了5，不自动等于第</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">五天完成卖出。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">② 计数</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">何时加一？</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">建仓日和盘后回调，</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">会影响边界时点。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">③ 卖单</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">条件满足</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">大于、等于、回调顺</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">序，都会改变发单时</text><text x="632.0" y="478" font-size="20" fill="#607369" font-weight="400">间。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">④ 成交</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">看实际记录</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">停牌或订单未成交，</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">可能延长真实持有。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">预约、提交离店申请与实际退房，不是同一个事件。</text></g></svg>