<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="三浪下跌：把图案翻译成不等式"><title>三浪下跌：把图案翻译成不等式</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">三浪下跌：把图案翻译成不等式</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">按源码从旧到新判断；符合条件不代表随后必然反弹</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58" y="220" width="230" height="65" rx="0" fill="#176b53"/><text x="74" y="262" font-size="22" fill="white" font-weight="700">位置</text><rect x="288" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="304" y="262" font-size="22" fill="white" font-weight="700">源码条件</text><rect x="572.6666666666667" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="588.6666666666667" y="262" font-size="22" fill="white" font-weight="700">假设涨跌</text><rect x="857.3333333333335" y="220" width="284.6666666666667" height="65" rx="0" fill="#176b53"/><text x="873.3333333333335" y="262" font-size="22" fill="white" font-weight="700">是否符合</text><rect x="58" y="285.0" width="230" height="53.0" rx="0" fill="#edf3eb"/><text x="74" y="320.5" font-size="23" fill="#243831" font-weight="400">第1段</text><rect x="288" y="285.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="304" y="320.5" font-size="23" fill="#243831" font-weight="400">低于−5%</text><rect x="572.6666666666667" y="285.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="588.6666666666667" y="320.5" font-size="23" fill="#243831" font-weight="400">−6%</text><rect x="857.3333333333335" y="285.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="873.3333333333335" y="320.5" font-size="23" fill="#243831" font-weight="400">符合</text><rect x="58" y="338.0" width="230" height="53.0" rx="0" fill="#f7f9f2"/><text x="74" y="373.5" font-size="23" fill="#243831" font-weight="400">第2段</text><rect x="288" y="338.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="304" y="373.5" font-size="23" fill="#243831" font-weight="400">大于0且低于4%</text><rect x="572.6666666666667" y="338.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="588.6666666666667" y="373.5" font-size="23" fill="#243831" font-weight="400">+2%</text><rect x="857.3333333333335" y="338.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="873.3333333333335" y="373.5" font-size="23" fill="#243831" font-weight="400">符合</text><rect x="58" y="391.0" width="230" height="53.0" rx="0" fill="#edf3eb"/><text x="74" y="426.5" font-size="23" fill="#243831" font-weight="400">第3段</text><rect x="288" y="391.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="304" y="426.5" font-size="23" fill="#243831" font-weight="400">低于+1%</text><rect x="572.6666666666667" y="391.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="588.6666666666667" y="426.5" font-size="23" fill="#243831" font-weight="400">−0.5%</text><rect x="857.3333333333335" y="391.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="873.3333333333335" y="426.5" font-size="23" fill="#243831" font-weight="400">符合</text><rect x="58" y="444.0" width="230" height="53.0" rx="0" fill="#f7f9f2"/><text x="74" y="479.5" font-size="23" fill="#243831" font-weight="400">第4段</text><rect x="288" y="444.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="304" y="479.5" font-size="23" fill="#243831" font-weight="400">低于−2%</text><rect x="572.6666666666667" y="444.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="588.6666666666667" y="479.5" font-size="23" fill="#243831" font-weight="400">−3%</text><rect x="857.3333333333335" y="444.0" width="284.6666666666667" height="53.0" rx="0" fill="#f7f9f2"/><text x="873.3333333333335" y="479.5" font-size="23" fill="#243831" font-weight="400">符合</text><rect x="58" y="497.0" width="230" height="53.0" rx="0" fill="#edf3eb"/><text x="74" y="532.5" font-size="23" fill="#243831" font-weight="400">第5段</text><rect x="288" y="497.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="304" y="532.5" font-size="23" fill="#243831" font-weight="400">低于−1%</text><rect x="572.6666666666667" y="497.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="588.6666666666667" y="532.5" font-size="23" fill="#243831" font-weight="400">−2%</text><rect x="857.3333333333335" y="497.0" width="284.6666666666667" height="53.0" rx="0" fill="#edf3eb"/><text x="873.3333333333335" y="532.5" font-size="23" fill="#243831" font-weight="400">符合</text><text x="62" y="598" font-size="20" fill="#176b53" font-weight="400">第三段只要求低于1%，不要求必须上涨。</text></g></svg>