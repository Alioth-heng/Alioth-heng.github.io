<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="RSRS：先观察通道，再形成相对指标"><title>RSRS：先观察通道，再形成相对指标</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">RSRS：先观察通道，再形成相对指标</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">此图描述原理，不表示历史代码已实现严格的二选一换仓</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">① 通道</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">最高价 / 最低</text><text x="80.0" y="369" font-size="28" fill="#243831" font-weight="400">价</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">窗口内做高低价回归</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">，观察斜率。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">② 比较</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">历史标准分</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">看近期斜率相对历史</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">分布的位置。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">③ 结合</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">标准分 × R²</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">再考虑拟合优度形成</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">指标。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">④ 指令</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">阈值 / 风格</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">比较大小盘信号，并</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">核对真实持仓变化。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">参数窗口和实际切片有差异；先核对代码，再讨论收益。</text></g></svg>