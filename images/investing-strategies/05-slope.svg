<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="抛物线择时：认清系数，才能算对坡度"><title>抛物线择时：认清系数，才能算对坡度</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">抛物线择时：认清系数，才能算对坡度</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">若y=a·x²+b·x+c，斜率=2a·x+b</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><line x1="90" y1="560" x2="1110" y2="560" stroke="#dbe4dc" stroke-width="2"/><polyline points="100.0,520.0 134.0,531.1 168.0,540.7 202.0,548.8 236.0,555.3 270.0,560.2 304.0,563.7 338.0,565.6 372.0,565.9 406.0,564.7 440.0,562.0 474.0,557.7 508.0,551.9 542.0,544.6 576.0,535.7 610.0,525.2 644.0,513.3 678.0,499.8 712.0,484.7 746.0,468.1 780.0,450.0 814.0,430.3 848.0,409.1 882.0,386.4 916.0,362.1 950.0,336.2 984.0,308.9 1018.0,280.0 1052.0,249.5" fill="none" stroke="#176b53" stroke-width="5" stroke-linejoin="round"/><text x="100" y="245" font-size="30" fill="#243831" font-weight="700">a对应二次项，b对应一次项</text><text x="100" y="290" font-size="23" fill="#607369" font-weight="400">系数拿反：曲线能拟合，坡度也会算错。</text><text x="680" y="608" font-size="29" fill="#176b53" font-weight="700">拟合过去 ≠ 知道未来</text></g></svg>