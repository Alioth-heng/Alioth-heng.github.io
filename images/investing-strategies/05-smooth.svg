<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="SSA降噪，与组合指标投票"><title>SSA降噪，与组合指标投票</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">SSA降噪，与组合指标投票</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">数学更复杂，不自动等于未来判断更准确</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">SSA</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">给录音降噪</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">重排、分解、重构；</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">平滑也可能带来滞后</text><text x="80.0" y="478" font-size="20" fill="#607369" font-weight="400">。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">交叉</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">价格与曲线</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">看前后相对位置，不</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">能只看事后完整曲线</text><text x="356.0" y="478" font-size="20" fill="#607369" font-weight="400">。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">组合指标</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">观察员投票</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">SMA、MACD、DMA、TRI</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">X给出方向信号。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">局限</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">信息可能重复</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">多个指标仍可能使用</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">相同的价格资料。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">每个历史时点，都应只使用当时可获得的数据窗口。</text></g></svg>