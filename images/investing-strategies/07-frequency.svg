<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="巡店频率，不等于交易频率"><title>巡店频率，不等于交易频率</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">巡店频率，不等于交易频率</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">检查得更勤，并不会自动让判断更准</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">日级检查</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">按日复查</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">先看清筛选、计数和退出流程</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">。</text><line x1="408.0" y1="378" x2="424.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M414.0,371 L424.0,378 L414.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="426.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="448.0" y="269" font-size="20" fill="#28618a" font-weight="700">分钟级检查</text><text x="448.0" y="329" font-size="28" fill="#243831" font-weight="400">观察可以更细</text><text x="448.0" y="414" font-size="20" fill="#607369" font-weight="400">需要细粒度数据和匹配的成交</text><text x="448.0" y="446" font-size="20" fill="#607369" font-weight="400">假设。</text><line x1="776.0" y1="378" x2="792.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M782.0,371 L792.0,378 L782.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="794.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="816.0" y="269" font-size="20" fill="#b77428" font-weight="700">真正下单</text><text x="816.0" y="329" font-size="28" fill="#243831" font-weight="400">条件满足才发</text><text x="816.0" y="414" font-size="20" fill="#607369" font-weight="400">不是每分钟必交易，也不是保</text><text x="816.0" y="446" font-size="20" fill="#607369" font-weight="400">证能卖出。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">保安每分钟巡门，不等于每分钟都必须把门开关一次。</text></g></svg>