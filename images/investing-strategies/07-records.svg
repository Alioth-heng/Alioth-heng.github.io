<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="四张单据，回答四个不同问题"><title>四张单据，回答四个不同问题</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">四张单据，回答四个不同问题</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">别只看最终盈亏，先检查程序有没有照规则执行</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">候选</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">准备买什么？</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">像购物清单，核对筛</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">选含义。</text><line x1="316.0" y1="378" x2="332.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M322.0,371 L332.0,378 L322.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="334.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="356.0" y="269" font-size="20" fill="#28618a" font-weight="700">委托</text><text x="356.0" y="329" font-size="28" fill="#243831" font-weight="400">发了什么订单？</text><text x="356.0" y="414" font-size="20" fill="#607369" font-weight="400">像提交订单，可能等</text><text x="356.0" y="446" font-size="20" fill="#607369" font-weight="400">待或取消。</text><line x1="592.0" y1="378" x2="608.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M598.0,371 L608.0,378 L598.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="610.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="632.0" y="269" font-size="20" fill="#b77428" font-weight="700">成交</text><text x="632.0" y="329" font-size="28" fill="#243831" font-weight="400">实际买卖多少？</text><text x="632.0" y="414" font-size="20" fill="#607369" font-weight="400">像购物小票，确认价</text><text x="632.0" y="446" font-size="20" fill="#607369" font-weight="400">格、数量、费用。</text><line x1="868.0" y1="378" x2="884.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M874.0,371 L884.0,378 L874.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="886.0" y="225" width="256.0" height="308" rx="14" fill="#edf3eb"/><text x="908.0" y="269" font-size="20" fill="#b94949" font-weight="700">持仓</text><text x="908.0" y="329" font-size="28" fill="#243831" font-weight="400">现在还剩什么？</text><text x="908.0" y="414" font-size="20" fill="#607369" font-weight="400">像购物篮，对照账户</text><text x="908.0" y="446" font-size="20" fill="#607369" font-weight="400">当前状态。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">清单、订单、小票和购物篮，不能拿一张代替另外三张。</text></g></svg>