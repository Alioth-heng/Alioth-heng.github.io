<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="有参数，不代表功能已经打开"><title>有参数，不代表功能已经打开</title><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="1200" height="720" fill="#fffdf8"/><text x="58" y="48" font-size="17" fill="#176b53" font-weight="700">从零读懂投资策略 / 原创教学图解</text><text x="58" y="109" font-size="36" fill="#243831" font-weight="700">有参数，不代表功能已经打开</text><text x="58" y="155" font-size="21" fill="#607369" font-weight="400">日级模板有止盈止损数值，但相关执行开关设为False</text><line x1="58" y1="183" x2="1142" y2="183" stroke="#dbe4dc" stroke-width="2"/><line x1="58" y1="653" x2="1142" y2="653" stroke="#dbe4dc" stroke-width="2"/><text x="58" y="687" font-size="17" fill="#607369" font-weight="400">原理示意 · 数字为假设例子，不是行情截图或历史回测结果</text><rect x="58.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="80.0" y="269" font-size="20" fill="#176b53" font-weight="700">烤箱面板</text><text x="80.0" y="329" font-size="28" fill="#243831" font-weight="400">温度设为180℃</text><text x="80.0" y="414" font-size="20" fill="#607369" font-weight="400">数值存在，只说明预设好了温</text><text x="80.0" y="446" font-size="20" fill="#607369" font-weight="400">度。</text><line x1="408.0" y1="378" x2="424.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M414.0,371 L424.0,378 L414.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="426.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="448.0" y="269" font-size="20" fill="#28618a" font-weight="700">电源开关</text><text x="448.0" y="329" font-size="28" fill="#243831" font-weight="400">仍然关闭</text><text x="448.0" y="414" font-size="20" fill="#607369" font-weight="400">相应执行分支不一定运行。</text><line x1="776.0" y1="378" x2="792.0" y2="378" stroke="#176b53" stroke-width="3"/><path d="M782.0,371 L792.0,378 L782.0,385" fill="none" stroke="#176b53" stroke-width="3"/><rect x="794.0" y="225" width="348.0" height="308" rx="14" fill="#edf3eb"/><text x="816.0" y="269" font-size="20" fill="#b77428" font-weight="700">交易模板</text><text x="816.0" y="329" font-size="28" fill="#243831" font-weight="400">is_hold_one=False</text><text x="816.0" y="414" font-size="20" fill="#607369" font-weight="400">不能只见到参数，就说规则已</text><text x="816.0" y="446" font-size="20" fill="#607369" font-weight="400">经生效。</text><text x="66" y="582" font-size="22" fill="#176b53" font-weight="400">参数、开关、函数调用与实际交易分支，必须一起看。</text></g></svg>