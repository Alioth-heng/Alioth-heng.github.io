<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img"><title>02 / 记事本是一棵控件树</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#475569"/></marker></defs>
<rect width="960" height="625" rx="16" fill="#f8fafc"/>
<style>text{font-family:Microsoft YaHei,sans-serif;fill:#172033;font-size:22px}.title{font-size:30px;font-weight:bold}.small{font-size:18px;fill:#475569}</style>
<text x="40" y="52" class="title">02 / 记事本是一棵控件树</text><text x="40" y="88" class="small">缩进代表父子关系；这是本次观察的简化结构，不是所有版本的固定模板。</text>
<rect x="40" y="120" width="880" height="88" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="64" y="154">Window：新建 文本文档 - Notepad</text><text x="64" y="185" class="small">顶层应用窗口：通过句柄和进程信息明确目标。</text>
<path d="M480 210V232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="240" width="880" height="88" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="64" y="274">　Pane → Document：文本编辑器</text><text x="64" y="305" class="small">真正的正文编辑区；本机类名是 RichEditD2DPT。</text>
<path d="M480 330V352" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="360" width="880" height="88" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="64" y="394">　Pane → MenuBar → MenuItem</text><text x="64" y="425" class="small">文件、编辑、查看；展开菜单后还可能出现新节点。</text>
<path d="M480 450V472" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="480" width="880" height="88" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="64" y="514">　TitleBar → Button</text><text x="64" y="545" class="small">最小化、最大化、关闭；这些属于记事本，不属于 TXT 文件。</text>
</svg>